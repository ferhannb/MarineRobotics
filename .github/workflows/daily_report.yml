name: Daily Maritime Autonomy Release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Generate daily report
        env:
          IEEE_XPLORE_API_KEY: ${{ secrets.IEEE_XPLORE_API_KEY }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          MARITIME_WATCH_RSS_FEEDS: ${{ vars.MARITIME_WATCH_RSS_FEEDS }}
        run: |
          python -m maritime_autonomy_watch.daily | tee daily-report-path.txt

      - name: Publish daily release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_FILE=$(tail -n 1 daily-report-path.txt)
          REPORT_DATE=$(basename "$REPORT_FILE" .md)
          REPORT_TAG="daily-$REPORT_DATE"
          REPORT_TITLE="Maritime Autonomy Watch — $REPORT_DATE"

          if gh release view "$REPORT_TAG" >/dev/null 2>&1; then
            gh release edit "$REPORT_TAG" \
              --title "$REPORT_TITLE" \
              --notes-file "$REPORT_FILE"
          else
            gh release create "$REPORT_TAG" \
              --title "$REPORT_TITLE" \
              --notes-file "$REPORT_FILE"
          fi

          SNAPSHOT_FILE="reports/assets/daily/$REPORT_DATE-category-snapshot.svg"
          if [ -f "$SNAPSHOT_FILE" ]; then
            gh release upload "$REPORT_TAG" "$SNAPSHOT_FILE" --clobber
          fi
